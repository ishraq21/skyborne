name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the release workflow runs all of this before it publishes

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Everything else (main, a version tag,
# a release dry run, which runs this same file) gets a group of its own, so none of them is ever cancelled
# or queued behind another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  page:
    name: Page build and smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: npm ci
        working-directory: page
      - run: npx playwright install --with-deps chromium
        working-directory: page
      - run: node build.js
        working-directory: page
      - name: The committed page matches its sources
        run: |
          stale="$(git status --porcelain -- skyborne/web page/dist)"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::The built page is out of date. Run 'cd page && node build.js' and commit skyborne/web and page/dist."
            exit 1
          fi
      - run: node tests/smoke.js
        working-directory: page
      - run: node tests/live-smoke.js
        working-directory: page
        env:
          SKYBORNE_PYTHON: python
      - name: The demo site builds and works
        run: |
          node build.js --site
          node tests/site-smoke.js
        working-directory: page
      - name: The Python package carries the page
        run: |
          python -m pip wheel . --no-deps -q -w wheel
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob('wheel/skyborne-*.whl')[0]).namelist()
          need = ['skyborne/web/index.html', 'skyborne/web/assets/three/three.module.min.js', 'skyborne/web/assets/icons/icon.svg']
          missing = [n for n in need if n not in names]
          print('wheel:', len(names), 'files;', sum('/web/' in n for n in names), 'page files')
          sys.exit(f'missing from the wheel: {missing}' if missing else 0)
          PY
