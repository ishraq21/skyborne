name: Release

# Pushing a version tag (v0.1.0) runs the full CI, builds the package and publishes it to PyPI, after you
# approve the `pypi` environment in GitHub. Running the workflow by hand from main (Actions -> Release ->
# Run workflow) is a dry run: it builds that commit as 0.1.0.devN and publishes it to TestPyPI. Publishing
# uses PyPI trusted publishing: no API tokens exist anywhere. The steps to follow are in docs/RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Check how this was started
    runs-on: ubuntu-latest
    steps:
      - name: A manual run must start from main (from a tag it could publish a dev build as the release)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main, not from $GITHUB_REF_NAME. To release, push a version tag."
          exit 1
      - run: echo "Started by $GITHUB_EVENT_NAME on $GITHUB_REF_NAME"

  ci:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml  # the same tests as every push to main, on every platform, plus the page tests

  build:
    name: Build the package
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: The tag matches the version in pyproject.toml, and is on main
        if: github.event_name == 'push'
        run: |
          python scripts/release_tools.py check-tag "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main."; exit 1; }

      - name: A dry run is a 0.1.0.devN build, so it can be uploaded again and again
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/release_tools.py dev-version "$GITHUB_RUN_NUMBER"

      # PyPI shows README.md as the package page, where relative image and doc links break. The links are
      # pinned to this tag (or, for a dry run, this commit) in the checkout only; the README in the repository is untouched.
      - name: Pin the README's links to this release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then ref="$GITHUB_REF_NAME"; else ref="$GITHUB_SHA"; fi
          python scripts/release_tools.py pin-readme "$ref" --write

      - name: Build
        run: |
          python -m pip install -r .github/requirements-release.txt
          python -m build
          python -m twine check --strict dist/*

      - name: The package carries the built page, and its description (as PyPI renders it) has no relative links
        run: python scripts/release_tools.py check-dist dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    # only a pushed tag: never a manual run, even one started from a tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'ishraq21/skyborne'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/skyborne
    permissions:
      id-token: write  # trusted publishing: PyPI trusts this workflow and environment, so no token is stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  publish-testpypi:
    name: Publish to TestPyPI (dry run)
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ishraq21/skyborne'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/skyborne
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # a re-run of the same dry run
