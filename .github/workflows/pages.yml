name: Demo site

# Publishes https://skyborne.dev (the city playing a recorded session, built by `node build.js --site`) to
# GitHub Pages. Only when a release tag is pushed, or by hand: Actions, Demo site, Run workflow.
# The custom domain is set in the repository's Pages settings (a CNAME file is ignored when Actions publishes).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time, and a running one is never cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
        working-directory: page
      - run: npx playwright install --with-deps chromium
        working-directory: page
      - run: node build.js --site
        working-directory: page
      - name: The site works and asks nothing of any server
        run: node tests/site-smoke.js
        working-directory: page
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: page/site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
